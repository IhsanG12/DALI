# Tells Netlify how to build the frontend, which lives in /client.
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"
  # Each production deploy costs Netlify credits, so skip the build entirely
  # unless something in client/ actually changed (README or server edits
  # don't need a new frontend).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
